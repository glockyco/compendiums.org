<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f9fb" />
    <meta
      name="description"
      content="Practical game data, maps, and reference tools for Ancient Kingdoms, Ardenfall, and Erenshor."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://compendiums.org/" />
    <meta property="og:title" content="compendiums.org" />
    <meta
      property="og:description"
      content="A directory of public game data, maps, and reference tools for Ancient Kingdoms, Ardenfall, and Erenshor."
    />
    <meta name="twitter:card" content="summary" />
    <title>compendiums.org — Game Data, Maps, and Reference Tools</title>
    <link rel="canonical" href="https://compendiums.org/" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page" aria-labelledby="page-title">
      <header class="site-header">
        <a class="brand" href="/" aria-label="compendiums.org home">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path d="M24 3 28.6 19.4 45 24l-16.4 4.6L24 45l-4.6-16.4L3 24l16.4-4.6L24 3Z" />
              <path d="M24 14 26.1 21.9 34 24l-7.9 2.1L24 34l-2.1-7.9L14 24l7.9-2.1L24 14Z" />
            </svg>
          </span>
          <span>compendiums.org</span>
        </a>
      </header>

      <section class="hero">
        <div class="hero__copy">
          <h1 id="page-title">Game Compendiums</h1>
          <p>
            A directory of public game data, maps, and reference tools<br />
            for
            <a class="steam-link" href="https://store.steampowered.com/app/2241380/Ancient_Kingdoms/" aria-label="Ancient Kingdoms on Steam">Ancient Kingdoms</a>,
            <a class="steam-link" href="https://store.steampowered.com/app/1154960/Ardenfall/" aria-label="Ardenfall on Steam">Ardenfall</a>, and
            <a class="steam-link" href="https://store.steampowered.com/app/2382520/Erenshor/" aria-label="Erenshor on Steam">Erenshor</a>.
          </p>
        </div>

        <nav class="project-list" aria-label="Compendium projects">
          <section class="project-group project-group--available" aria-labelledby="available-projects">
            <h2 class="project-group__title" id="available-projects">Available now</h2>
            <div class="project-group__links">
              <a
                class="project-link project-link--featured"
                href="https://ancient-kingdoms.compendiums.org"
              >
                <span class="project-link__preview" aria-hidden="true">
                  <img
                    src="/images/ancient-kingdoms.webp"
                    alt=""
                    width="1024"
                    height="640"
                    loading="lazy"
                    decoding="async"
                  />
                </span>
                <span class="project-link__details">
                  <span class="project-link__icon" aria-hidden="true">
                    <svg viewBox="0 0 48 48" focusable="false">
                      <path d="M10 40V17l7 5 7-12 7 12 7-5v23H10Z" />
                      <path d="M16 40V27h16v13" />
                    </svg>
                  </span>
                  <span class="project-link__name">Ancient Kingdoms</span>
                  <span class="project-link__arrow" aria-hidden="true">→</span>
                </span>
              </a>

              <a class="project-link project-link--featured" href="https://erenshor.compendiums.org">
                <span class="project-link__preview" aria-hidden="true">
                  <img
                    src="/images/erenshor.webp"
                    alt=""
                    width="1024"
                    height="640"
                    loading="lazy"
                    decoding="async"
                  />
                </span>
                <span class="project-link__details">
                  <span class="project-link__icon" aria-hidden="true">
                    <svg viewBox="0 0 48 48" focusable="false">
                      <path d="M24 5 28 20 43 24l-15 4-4 15-4-15-15-4 15-4 4-15Z" />
                      <path d="M24 15v18M15 24h18" />
                    </svg>
                  </span>
                  <span class="project-link__name">Erenshor</span>
                  <span class="project-link__arrow" aria-hidden="true">→</span>
                </span>
              </a>
            </div>
          </section>

          <section class="project-group" aria-labelledby="wip-projects">
            <h2 class="project-group__title" id="wip-projects">Work in progress</h2>
            <div class="project-group__links">
              <a class="project-link" href="https://ardenfall.compendiums.org">
                <span class="project-link__icon" aria-hidden="true">
                  <svg viewBox="0 0 48 48" focusable="false">
                    <path d="M24 42V8" />
                    <path d="M24 18c7-8 14-8 18-7-1 8-7 14-18 14" />
                    <path d="M24 28c-7-8-14-8-18-7 1 8 7 14 18 14" />
                  </svg>
                </span>
                <span class="project-link__name">Ardenfall</span>
                <span class="project-link__arrow" aria-hidden="true">→</span>
              </a>
            </div>
          </section>
        </nav>

        <footer class="support-colophon" aria-label="Support">
          <span class="support-colophon__rule" aria-hidden="true"></span>
          <a
            class="support-link"
            href="https://ko-fi.com/wowmuch"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Support compendiums.org on Ko-fi"
          >
            <span>Support on Ko-fi</span>
            <svg class="support-link__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 1.832 3.011.723 4.311zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"
              />
            </svg>
          </a>
          <span class="support-colophon__rule" aria-hidden="true"></span>
        </footer>
      </section>
    </main>
  </body>
</html>
